name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 前端检查 + pytest（PostgreSQL + SQLite）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowbase
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12"
          cache: npm

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate and build frontend
        run: |
          npm ci --no-audit --no-fund
          npm run frontend:check

      - name: Validate Compose and shell installer
        run: |
          docker compose --file compose.yaml config >/dev/null
          bash -n scripts/install-wsl-docker-engine.sh

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Recurse -File |
            Where-Object { $_.Extension -in ".ps1", ".psm1" } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors
              )
              if ($errors.Count -gt 0) {
                $failed = $true
                Write-Error "$($_.FullName): $($errors.Message -join '; ')"
              }
            }
          if ($failed) {
            throw "PowerShell syntax validation failed."
          }

      - name: Create isolated test databases
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres@127.0.0.1:5432/knowbase", autocommit=True) as conn:
              conn.execute("CREATE DATABASE knowbase_test")
              conn.execute("CREATE DATABASE knowbase_migration_test")
          print("isolated databases created")
          PY

      - name: Validate migrations from an empty database
        run: |
          python -m alembic upgrade head
          python -m alembic check
        env:
          DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/knowbase_migration_test

      - name: Run tests
        run: pytest -q
        env:
          # conftest 在导入应用前把全进程固定到该独立测试库。
          KNOWBASE_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/knowbase_test
          # 测试使用假 embedding/LLM provider，无需真实密钥
