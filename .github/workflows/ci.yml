name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest（含 PostgreSQL + pgvector）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowbase
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create test database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres@127.0.0.1:5432/knowbase", autocommit=True) as conn:
              conn.execute("CREATE DATABASE knowbase_test")
          print("knowbase_test created")
          PY

      - name: Run tests
        run: pytest -q
        env:
          # 测试库连接串：conftest 会据此推导 knowbase_test
          DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/knowbase
          # 测试使用假 embedding/LLM provider，无需真实密钥
