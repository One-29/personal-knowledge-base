name: knowbase

services:
  database:
    image: pgvector/pgvector:pg16
    container_name: knowbase-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowbase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowbase"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
    name: knowbase_pgdata
