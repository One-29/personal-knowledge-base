[project]
name = "knowbase"
version = "0.1.0"
description = "KnowBase: 自托管个人知识库问答系统（RAG + 溯源 + 拒答）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",      # PostgreSQL 驱动（SQLAlchemy 2.x 推荐 psycopg3）
    "pydantic-settings>=2.0",    # .env 配置加载
    "alembic>=1.13",             # 数据库迁移
    "pgvector>=0.2",             # 向量列类型（SQLAlchemy 集成）
    "python-multipart>=0.0.9",   # FastAPI 文件上传（multipart 解析）
    "httpx>=0.27",               # Embedding / LLM HTTP 客户端（运行时依赖）
    "Pillow>=11.0",              # 图片格式/完整性校验；只读，不重编码原图
]

[project.optional-dependencies]
desktop = [
    "pywebview>=6.2.1,<7",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
