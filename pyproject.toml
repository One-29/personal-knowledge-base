[project]
name = "knowbase"
version = "0.1.0"
description = "KnowBase: 自托管个人知识库问答系统（RAG + 溯源 + 拒答）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",      # PostgreSQL 驱动（SQLAlchemy 2.x 推荐 psycopg3）
    "pydantic-settings>=2.0",    # .env 配置加载
    "alembic>=1.13",             # 数据库迁移
    "python-multipart>=0.0.9",   # FastAPI 文件上传（multipart 解析）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",               # FastAPI TestClient 依赖
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
